name: Release

# One release authority: a human pushes a vX.Y.Z tag, and this workflow proves the
# tagged tree with the same gates CI runs before anything is published.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    permissions:
      contents: read
    uses: ./.github/workflows/verify.yml

  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package the Omarchy plugin
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p "$RUNNER_TEMP/pack/workspan.tracker"
          cp plugin/manifest.json plugin/Panel.qml plugin/Workspan.js plugin/README.md "$RUNNER_TEMP/pack/workspan.tracker/"
          (cd "$RUNNER_TEMP/pack" && zip -qr "$RUNNER_TEMP/workspan.tracker-$version.zip" workspan.tracker)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/workspan.tracker-$version.zip" \
            --title "Workspan $version" \
            --generate-notes $prerelease
